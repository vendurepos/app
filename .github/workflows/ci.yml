name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck and unit tests
    # Fork PRs get no RXDB_PREMIUM secret, so the licensed install cannot run there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      # No pnpm store cache: this public repo installs rxdb-premium with a
      # licence, and fork PR workflows can restore caches saved on main.
      # setup-node v5 caches automatically when package.json names a packageManager.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      # rxdb-premium's postinstall decrypts the licensed plugins with this token
      # and echoes it as `accessToken: …`, so the whole install output is
      # filtered. `shell: bash` runs with pipefail, so a failed install still fails.
      - name: Install (licence token filtered)
        run: '{ pnpm install --frozen-lockfile; } 2>&1 | grep -vi accessToken'
        shell: bash
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
      # The store must hold only the published tarball, never the decrypted build.
      - name: Assert the pnpm store holds no decrypted rxdb-premium
        shell: bash
        run: |
          index="$(pnpm store path)/index"
          entries=$(grep -rl '"name":"rxdb-premium"' "$index" || true)
          [ -n "$entries" ] || { echo "rxdb-premium is missing from the store index" >&2; exit 1; }
          if grep -l '"sideEffects"' $entries; then
            echo "the pnpm store holds rxdb-premium's post-install build" >&2
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: bash scripts/check-web-bundle.test.sh

  # The Vendure plugin is standalone npm with its own lockfile; it needs no secrets.
  plugin:
    name: Vendure plugin (typecheck and Postgres e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendure
          POSTGRES_PASSWORD: vendure
          POSTGRES_DB: plugin
        ports: ['5445:5432']
        options: >-
          --health-cmd "pg_isready -U vendure -d plugin"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # The real SMTP transport of test/email-smtp.e2e.ts, as in the package's docker-compose.yml.
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ['1045:1025', '8045:8025']
    defaults:
      run:
        working-directory: packages/vendure-plugin
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: bash scripts/test-stack.test.sh
      - run: npm test

  # No artifacts are uploaded: dist, public, apps/pos/test-results and
  # Playwright traces contain or can capture licensed rxdb-premium code.
  # Accepted risk: a build error inside rxdb-premium would print a code frame
  # of it to this public log; a healthy build never does.
  web-smoke:
    name: Web smoke (Vendure dev store + Playwright)
    # Fork PRs get no RXDB_PREMIUM secret, so the licensed install cannot run there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install (licence token filtered)
        run: '{ pnpm install --frozen-lockfile; } 2>&1 | grep -vi accessToken'
        shell: bash
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
      - name: Assert the pnpm store holds no decrypted rxdb-premium
        shell: bash
        run: |
          index="$(pnpm store path)/index"
          entries=$(grep -rl '"name":"rxdb-premium"' "$index" || true)
          [ -n "$entries" ] || { echo "rxdb-premium is missing from the store index" >&2; exit 1; }
          if grep -l '"sideEffects"' $entries; then
            echo "the pnpm store holds rxdb-premium's post-install build" >&2
            exit 1
          fi
      - name: Install Playwright Chromium
        run: pnpm --filter @vendurepos/pos exec playwright install --with-deps chromium
      - name: Web smoke
        run: pnpm smoke:web
      - name: Vendure log on failure
        if: failure()
        run: tail -n 150 dev/vendure-store/.run/vendure.log || true

  # Plan VA6/VA7, not a required check: the plugin packed and installed into a fresh store, then 25 sales, 20 offline.
  # The web smoke's secret and artifact rules apply; scripts/e2e.sh prints the Vendure log on failure (its store is temporary).
  offline-e2e:
    name: Offline e2e
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install (licence token filtered)
        run: '{ pnpm install --frozen-lockfile; } 2>&1 | grep -vi accessToken'
        shell: bash
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
      - name: Assert the pnpm store holds no decrypted rxdb-premium
        shell: bash
        run: |
          index="$(pnpm store path)/index"
          entries=$(grep -rl '"name":"rxdb-premium"' "$index" || true)
          [ -n "$entries" ] || { echo "rxdb-premium is missing from the store index" >&2; exit 1; }
          if grep -l '"sideEffects"' $entries; then
            echo "the pnpm store holds rxdb-premium's post-install build" >&2
            exit 1
          fi
      - name: Install Playwright Chromium
        run: pnpm --filter @vendurepos/pos exec playwright install --with-deps chromium
      # Filtered like the install: the web export's build can print the licence token.
      - name: Offline e2e
        run: '{ pnpm e2e; } 2>&1 | grep -vi accessToken'
        shell: bash
        # The bundle check compares the export with the licence token; it never prints it.
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}

  # Plan VA9, not a required check: the demo build (EXPO_PUBLIC_VENDUREPOS_DEMO=1) with its CSP and e2e/demo.spec.ts, no Vendure store.
  # The web smoke's secret and artifact rules apply.
  demo-e2e:
    name: Demo e2e (no backend)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install (licence token filtered)
        run: '{ pnpm install --frozen-lockfile; } 2>&1 | grep -vi accessToken'
        shell: bash
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
      - name: Assert the pnpm store holds no decrypted rxdb-premium
        shell: bash
        run: |
          index="$(pnpm store path)/index"
          entries=$(grep -rl '"name":"rxdb-premium"' "$index" || true)
          [ -n "$entries" ] || { echo "rxdb-premium is missing from the store index" >&2; exit 1; }
          if grep -l '"sideEffects"' $entries; then
            echo "the pnpm store holds rxdb-premium's post-install build" >&2
            exit 1
          fi
      - name: Install Playwright Chromium
        run: pnpm --filter @vendurepos/pos exec playwright install --with-deps chromium
      # Filtered like the install: the demo web export's build can print the licence token.
      - name: Demo e2e
        run: '{ pnpm e2e:demo; } 2>&1 | grep -vi accessToken'
        shell: bash
        # The bundle check compares the export with the licence token; it never prints it.
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
