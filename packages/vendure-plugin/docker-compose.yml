# Test services for @vendurepos/plugin. scripts/test-stack.sh selects the worktree project and ports.
# Direct Compose runs retain the CI/legacy loopback port defaults.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vendure
      POSTGRES_PASSWORD: vendure
      POSTGRES_DB: plugin
      TZ: UTC
      PGTZ: UTC
    ports: ["127.0.0.1:${PLUGIN_TEST_PG_PORT:-5445}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vendure", "-d", "plugin"]
      interval: 2s
      timeout: 5s
      retries: 30
  # The real SMTP transport of test/email-smtp.e2e.ts, with SMTP and HTTP API on loopback.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ["127.0.0.1:${PLUGIN_TEST_SMTP_PORT:-1045}:1025", "127.0.0.1:${PLUGIN_TEST_MAILPIT_PORT:-8045}:8025"]
