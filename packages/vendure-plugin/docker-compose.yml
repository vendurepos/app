# Test services for @vendurepos/plugin. Project name vendurepos-plugin-test (package.json scripts),
# loopback :5445, so it never collides with the dev store (:5442), the smoke store (:5443) or S1 (:5444).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vendure
      POSTGRES_PASSWORD: vendure
      POSTGRES_DB: plugin
      TZ: UTC
      PGTZ: UTC
    ports: ["127.0.0.1:5445:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vendure", "-d", "plugin"]
      interval: 2s
      timeout: 5s
      retries: 30
  # The real SMTP transport of test/email-smtp.e2e.ts: SMTP on loopback :1045, its HTTP API on :8045.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ["127.0.0.1:1045:1025", "127.0.0.1:8045:8025"]
