<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- The session token lives in localStorage (medusapos ADR 0002), so no inline or eval'd script may run.
         script-src allows 'wasm-unsafe-eval' (WebAssembly compilation only, never 'unsafe-eval') for SQLite-wasm.
         connect-src stays open to https: for any store, and to plain HTTP on loopback only
         (Chromium ignores http://[::1]:* as an invalid source, so it is left out).
         style-src needs 'unsafe-inline' for react-native-web's injected styles.
         frame-ancestors cannot be set by a meta tag; the hosting header adds it (VA8). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="VendurePOS is a point of sale for Vendure: sell in the browser with your store's catalogue, stock and tax, online or offline." />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      .boot-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #0f172a;
      }
      .boot-splash-name { font-size: 1.5rem; font-weight: 600; margin: 0; }
      .boot-splash-text { font-size: 0.95rem; color: #64748b; margin: 0.5rem 0 0; }
      @media (prefers-color-scheme: dark) {
        .boot-splash { background: #0b1120; }
        .boot-splash-name { color: #e2e8f0; }
        .boot-splash-text { color: #94a3b8; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <!-- Static first paint before the bundle runs; React replaces it on first render (single-page output). -->
      <div class="boot-splash" role="status" aria-live="polite"><p class="boot-splash-name">VendurePOS</p><p class="boot-splash-text">Loading the till…</p></div>
    </div>
  </body>
</html>
